<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Rashmi Tuladhar</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="thank-you-page">
        <div class="thank-you-content">
            <div class="thank-you-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1>Thank You!</h1>
            <p>Your message has been sent successfully.</p>
            <p>I'll get back to you as soon as possible at <strong>rashmituladhar70@gmail.com</strong></p>
            <a href="index.html" class="btn-primary">
                <i class="fas fa-home"></i> Back to Portfolio
            </a>
        </div>
    </div>

    <style>
        .thank-you-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fafc 0%, #e0f7f4 100%);
        }

        .thank-you-content {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }

        .thank-you-icon {
            font-size: 5rem;
            color: #14b8a6;
            margin-bottom: 20px;
            animation: scaleIn 0.5s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .thank-you-content h1 {
            font-size: 2.5rem;
            color: #1e293b;
            margin-bottom: 15px;
        }

        .thank-you-content p {
            font-size: 1.1rem;
            color: #64748b;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .thank-you-content strong {
            color: #14b8a6;
        }

        .btn-primary {
            margin-top: 30px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</body>
</html>
